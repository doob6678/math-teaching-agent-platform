spring:
  application:
    name: math-agent-rag-backend
  servlet:
    encoding:
      # Resource paths and titles are user-provided Chinese text. Force UTF-8 before Jackson reads requests so a
      # Windows PowerShell/browser upload cannot register a mojibake path that points to no real source file.
      charset: UTF-8
      force: true
    multipart:
      # Teacher resource uploads legitimately include full exam PDFs and bundled lesson packages. Keep the servlet
      # envelope aligned with TeacherResourceUploadService's own 256 MB guard so requests fail for real business
      # limits instead of Spring Boot's accidental 1 MB default before controller code runs.
      max-file-size: ${MATH_AGENT_HTTP_MULTIPART_MAX_FILE_SIZE:256MB}
      max-request-size: ${MATH_AGENT_HTTP_MULTIPART_MAX_REQUEST_SIZE:256MB}
  ai:
    model:
      chat: ${MATH_AGENT_AI_CHAT_MODEL:openai}
      embedding: ${MATH_AGENT_AI_EMBEDDING_MODEL:local-clip-vit-large-patch14-zh}
      image: ${MATH_AGENT_AI_IMAGE_MODEL:none}
      audio:
        speech: ${MATH_AGENT_AI_AUDIO_SPEECH_MODEL:none}
        transcription: ${MATH_AGENT_AI_AUDIO_TRANSCRIPTION_MODEL:none}
      moderation: ${MATH_AGENT_AI_MODERATION_MODEL:none}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          # Verified against the configured OpenAI-compatible /models endpoint. This model is also the default for
          # question-image understanding, so text and visual explanations remain on one multimodal route.
          model: ${OPENAI_CHAT_MODEL:gpt-5.6-luna}
  flyway:
    enabled: false

server:
  port: 8080
  tomcat:
    # Tomcat must decode percent-encoded Chinese query parameters as UTF-8 before RAG focus extraction; otherwise
    # a real request such as “涂色问题” becomes question marks and the correct teacher document cannot be admitted.
    uri-encoding: UTF-8

math-agent:
  ai:
    default-provider: ${MATH_AGENT_AI_DEFAULT_PROVIDER:openai}
    # A streamed student answer must begin promptly; this is per provider attempt, not an unbounded request lifetime.
    chat:
      request-timeout-ms: ${MATH_AGENT_AI_CHAT_REQUEST_TIMEOUT_MS:30000}
    dashscope:
      name: dashscope
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${DASHSCOPE_API_KEY:}
      chat-model: ${DASHSCOPE_CHAT_MODEL:qwen3.6-flash}
    openai:
      name: openai
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_API_KEY:}
      chat-model: ${OPENAI_CHAT_MODEL:gpt-5.6-luna}
    deepseek:
      name: deepseek
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      chat-model: ${DEEPSEEK_CHAT_MODEL:deepseek-v4-flash}
    ark:
      name: ark
      # Volcengine Ark OpenAI-compatible online inference uses /api/v3.
      # Official guide: https://www.volcengine.com/docs/82379/1330626
      # Do not use /api/coding/v3 here; that endpoint is for Coding Plan APIs and uses different routing.
      base-url: ${ARK_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
      api-key: ${ARK_API_KEY:}
      # This must be an Ark model ID/endpoint accepted by /api/v3/chat/completions.
      chat-model: ${ARK_CHAT_MODEL:doubao-seed-2-0-lite-260428}
  teaching:
    ai-draft:
      max-retries: ${MATH_AGENT_TEACHING_AI_DRAFT_MAX_RETRIES:1}
  student:
    explanation:
      # Keep student question OCR and explanation generation on the same verified multimodal provider by default.
      openai-vision-model: ${OPENAI_VISION_MODEL:${OPENAI_CHAT_MODEL:gpt-5.6-luna}}
      # Authorized teacher page transcription uses this same client. A relay can need longer than chat completion, so
      # retain an explicit three-minute ceiling instead of failing a real visual read at the old 45-second default.
      vision-timeout-ms: ${MATH_AGENT_STUDENT_EXPLANATION_VISION_TIMEOUT_MS:180000}
      # Two providers preserve one recovery path while capping a failed turn at two 30-second attempts.
      max-provider-attempts: ${MATH_AGENT_STUDENT_EXPLANATION_MAX_PROVIDER_ATTEMPTS:2}
      conversation-context-max-chars: ${MATH_AGENT_STUDENT_EXPLANATION_CONVERSATION_CONTEXT_MAX_CHARS:100000}
      conversation-history-fetch-limit: ${MATH_AGENT_STUDENT_EXPLANATION_CONVERSATION_HISTORY_FETCH_LIMIT:200}
      long-term-memory-top-k: ${MATH_AGENT_STUDENT_EXPLANATION_LONG_TERM_MEMORY_TOP_K:5}
      long-term-memory-max-chars: ${MATH_AGENT_STUDENT_EXPLANATION_LONG_TERM_MEMORY_MAX_CHARS:12000}
  database:
    enabled: ${MATH_AGENT_DB_ENABLED:true}
    url: ${MATH_AGENT_DB_URL:}
    username: ${MATH_AGENT_DB_USERNAME:}
    password: ${MATH_AGENT_DB_PASSWORD:}
  redis:
    redisson:
      enabled: ${MATH_AGENT_REDIS_REDISSON_ENABLED:true}
      address: ${MATH_AGENT_REDIS_REDISSON_ADDRESS:redis://127.0.0.1:6379}
    capability-store:
      enabled: ${MATH_AGENT_REDIS_CAPABILITY_STORE_ENABLED:true}
      key-prefix: ${MATH_AGENT_REDIS_CAPABILITY_STORE_KEY_PREFIX:math-agent:security:capability}
    rate-limit:
      enabled: ${MATH_AGENT_REDIS_RATE_LIMIT_ENABLED:true}
      key-prefix: ${MATH_AGENT_REDIS_RATE_LIMIT_KEY_PREFIX:math-agent:api:rate-limit}
    search-cache:
      # Teacher-source re-sync must be visible to the next retrieval immediately; operators may opt in explicitly
      # after an audited corpus build, but stale cache entries are unsafe as the local default.
      enabled: ${MATH_AGENT_REDIS_SEARCH_CACHE_ENABLED:false}
      key-prefix: ${MATH_AGENT_REDIS_SEARCH_CACHE_KEY_PREFIX:math-agent:retrieval:textbook-search}
      ttl: ${MATH_AGENT_REDIS_SEARCH_CACHE_TTL:10m}
      null-value-ttl: ${MATH_AGENT_REDIS_SEARCH_CACHE_NULL_VALUE_TTL:1m}
  vector-index:
    # Milvus is a required local WSL service. URI and all non-sensitive collection parameters stay committed here;
    # the optional authorization token remains external because credentials must never enter the repository.
    enabled: true
    milvus-uri: http://127.0.0.1:19530
    milvus-token: ${MATH_AGENT_MILVUS_TOKEN:}
    collection-name: math_agent_teacher_text_blocks_bge
    student-memory-collection-name: math_agent_student_memories_bge
    textbook-text-collection-name: textbook_text_collection
    textbook-image-collection-name: textbook_image_collection
    dimension: 512
    textbook-text-dimension: 512
    textbook-image-dimension: 768
    # The live local CLIP encoder is 512-dimensional while the historical page corpus is 768-dimensional.
    # Migration normalizes its shared prefix and zero-pads it into the stable 768-d collection, reproducing the
    # previous NPY common-prefix cosine exactly without mixing CLIP with BGE.
    textbook-image-query-dimension: 512
    textbook-metric-type: COSINE
    # Exact FLAT cosine search is intentional for the current 3k/1k textbook corpus: it reproduces the audited NPY
    # baseline exactly. A future corpus-size migration must benchmark an ANN replacement before changing this value.
    textbook-index-type: FLAT
    textbook-index-params: '{}'
    textbook-top-k: 20
    # Textbook pages carry full OCR and formulas in metadata; sixteen vectors keep each real Milvus REST payload
    # below the Windows-to-WSL proxy timeout while preserving batched ingestion throughput.
    textbook-upsert-batch-size: 16
    textbook-timeout-ms: 120000
    textbook-corpus-version: textbook-section-c2-milvus-v1
    # Local worker is the primary embedding path. Cloud embeddings remain available
    # only when explicitly configured through MATH_AGENT_EMBEDDING_BASE_URL/API_KEY.
    embedding-base-url: ${MATH_AGENT_EMBEDDING_BASE_URL:http://127.0.0.1:8091/v1}
    embedding-api-key: ${MATH_AGENT_EMBEDDING_API_KEY:${MATH_AGENT_WORKER_API_KEY:}}
    embedding-model: ${MATH_AGENT_EMBEDDING_MODEL:local-bge-small-zh-v1.5}
    # Parallel textbook/teacher retrieval can queue one cold CUDA rerank batch behind another; keep the request
    # bounded while allowing the real worker to finish instead of triggering an expensive embedding fallback.
    request-timeout-ms: ${MATH_AGENT_VECTOR_INDEX_TIMEOUT_MS:120000}
  teacher:
    sync:
      rabbitmq:
        # A sync job can render PDFs, call Feishu, invoke Python vision and rebuild Milvus. Keep that work out of
        # the MCP/HTTP request thread and let the durable MySQL job remain the idempotency authority.
        exchange: ${MATH_AGENT_RABBITMQ_SOURCE_SYNC_EXCHANGE:teacher.source-sync}
        routing-key: ${MATH_AGENT_RABBITMQ_SOURCE_SYNC_ROUTING_KEY:teacher.source-sync.execute}
        queue: ${MATH_AGENT_RABBITMQ_SOURCE_SYNC_QUEUE:teacher.source-sync.execute.q}
        dead-letter-queue: ${MATH_AGENT_RABBITMQ_SOURCE_SYNC_DLQ:teacher.source-sync.execute.dlq}
        consumer-concurrency: ${MATH_AGENT_RABBITMQ_SOURCE_SYNC_CONSUMER_CONCURRENCY:1}
        consumer-max-concurrency: ${MATH_AGENT_RABBITMQ_SOURCE_SYNC_CONSUMER_MAX_CONCURRENCY:2}
        prefetch: ${MATH_AGENT_RABBITMQ_SOURCE_SYNC_PREFETCH:1}
        publisher-confirm-timeout-milliseconds: ${MATH_AGENT_RABBITMQ_SOURCE_SYNC_CONFIRM_TIMEOUT_MS:5000}
      scheduler:
        # Background sync is opt-in. Enabling it additionally requires a real administrator service identity.
        enabled: ${MATH_AGENT_TEACHER_SYNC_SCHEDULER_ENABLED:false}
        fixed-delay-ms: ${MATH_AGENT_TEACHER_SYNC_SCHEDULER_FIXED_DELAY_MS:300000}
        tenant-id: ${MATH_AGENT_TEACHER_SYNC_SCHEDULER_TENANT_ID:default}
        service-role: ${MATH_AGENT_TEACHER_SYNC_SCHEDULER_SERVICE_ROLE:admin}
        service-subject-id: ${MATH_AGENT_TEACHER_SYNC_SCHEDULER_SERVICE_SUBJECT_ID:}
        # A scheduler never sweeps all documents implicitly. Operators opt in each stable source id explicitly.
        document-ids: ${MATH_AGENT_TEACHER_SYNC_SCHEDULER_DOCUMENT_IDS:}
    search:
      runtime:
        # CPU BGE reranking is quadratic in candidate count. Twelve evidence blocks preserve one candidate per
        # narrow-library document while keeping the post-warmup P95 target below five seconds on the local worker.
        max-block-rerank-candidates: ${MATH_AGENT_TEACHER_SEARCH_RUNTIME_MAX_BLOCK_RERANK_CANDIDATES:12}
    formula-recognition:
      # Only documents uploaded with parseMode=AI consume this budget. TEXT parsing remains local and free.
      enabled: ${MATH_AGENT_FORMULA_VISION_ENABLED:true}
      max-images-per-document: ${MATH_AGENT_FORMULA_VISION_MAX_IMAGES_PER_DOCUMENT:48}
      # Two full pages keep symbols legible for the default visual model; set exactly 4 only after a quality check.
      pages-per-request: ${MATH_AGENT_FORMULA_VISION_PAGES_PER_REQUEST:2}
  textbook:
    retrieval:
      # Transport windows for the local semantic worker. They are deliberately separate from ranking logic, so a
      # deployment can meet its latency budget without reintroducing hidden score weights into Java code.
      query-focus:
        max-query-chars: ${MATH_AGENT_TEXTBOOK_QUERY_FOCUS_MAX_CHARS:120}
        max-clauses: ${MATH_AGENT_TEXTBOOK_QUERY_FOCUS_MAX_CLAUSES:2}
        max-graph-tags: ${MATH_AGENT_TEXTBOOK_QUERY_FOCUS_MAX_GRAPH_TAGS:4}
      rerank:
        max-document-candidates: ${MATH_AGENT_TEXTBOOK_RERANK_MAX_DOCUMENT_CANDIDATES:3}
        max-pages-per-document: ${MATH_AGENT_TEXTBOOK_RERANK_MAX_PAGES_PER_DOCUMENT:3}
        # Rerank the complete bounded evidence matrix.  Response count remains
        # request-controlled; these are candidate-comparison limits only.
        max-rerank-documents: ${MATH_AGENT_TEXTBOOK_RERANK_MAX_DOCUMENTS:3}
        max-page-candidates: ${MATH_AGENT_TEXTBOOK_RERANK_MAX_PAGE_CANDIDATES:9}
        page-text-chars: ${MATH_AGENT_TEXTBOOK_RERANK_PAGE_TEXT_CHARS:120}
        formula-text-chars: ${MATH_AGENT_TEXTBOOK_RERANK_FORMULA_TEXT_CHARS:40}
        document-text-chars: ${MATH_AGENT_TEXTBOOK_RERANK_DOCUMENT_TEXT_CHARS:320}
  protocol:
    mcp:
      registry:
        clients: []
  agent-worker:
    # Dedicated Worker authentication is intentionally separate from user capability tokens.
    shared-key: ${MATH_AGENT_AGENT_WORKER_SHARED_KEY:}
    dispatch:
      enabled: ${MATH_AGENT_AGENT_WORKER_DISPATCH_ENABLED:true}
    runtime:
      enabled: ${MATH_AGENT_AGENT_WORKER_RUNTIME_ENABLED:false}
      worker-id: ${MATH_AGENT_AGENT_WORKER_ID:local-agent-worker}
      version: ${MATH_AGENT_AGENT_WORKER_VERSION:0.1.0}
      max-concurrency: ${MATH_AGENT_AGENT_WORKER_MAX_CONCURRENCY:1}
      lease-seconds: ${MATH_AGENT_AGENT_WORKER_LEASE_SECONDS:300}
      heartbeat-milliseconds: ${MATH_AGENT_AGENT_WORKER_HEARTBEAT_MILLISECONDS:15000}
    recovery-milliseconds: ${MATH_AGENT_AGENT_WORKER_RECOVERY_MILLISECONDS:30000}
    liveness-check-milliseconds: ${MATH_AGENT_AGENT_WORKER_LIVENESS_CHECK_MILLISECONDS:15000}
    heartbeat-timeout-milliseconds: ${MATH_AGENT_AGENT_WORKER_HEARTBEAT_TIMEOUT_MILLISECONDS:45000}
    maximum-attempts: ${MATH_AGENT_AGENT_WORKER_MAXIMUM_ATTEMPTS:3}
  knowledge:
    graph-spine:
      seed-enabled: ${MATH_AGENT_KNOWLEDGE_GRAPH_SPINE_SEED_ENABLED:true}
      tenant-id: ${MATH_AGENT_KNOWLEDGE_GRAPH_SPINE_TENANT_ID:school-a}
      permission-scope: ${MATH_AGENT_KNOWLEDGE_GRAPH_SPINE_PERMISSION_SCOPE:MATH_VIP}
      method-node-limit: ${MATH_AGENT_KNOWLEDGE_GRAPH_SPINE_METHOD_NODE_LIMIT:50}
      source-location: ${MATH_AGENT_KNOWLEDGE_GRAPH_SPINE_SOURCE_LOCATION:classpath:knowledge/graph-spine-v0.1.md}
  resources:
    # c2 is the searchable small-heading corpus.  The original page corpus b4
    # remains independently stored for page-level comparison and rollback; it
    # is not overwritten or merged into the section index.
    processed-books-root: ${MATH_AGENT_PROCESSED_BOOKS_ROOT:C:/Users/doob/Desktop/个人资料/高中数学/下载课本代码/tchMaterial-parser-main/tchMaterial-parser-main/processed_books_section_shadow_all_mini_c2}
    project-test-data-root: ${MATH_AGENT_PROJECT_TEST_DATA_ROOT:C:/Users/doob/Desktop/code/dev/math_agent_rag/文档/项目测试数据位置}
    design-spec-root: ${MATH_AGENT_DESIGN_SPEC_ROOT:C:/Users/doob/Desktop/code/dev/math_agent_rag/文档/设计方案体系}
    reference-handout-pdf: ${MATH_AGENT_REFERENCE_HANDOUT_PDF:C:/Users/doob/Desktop/code/dev/math_agent_rag/文档/项目测试数据位置/参考讲义数学空间向量.pdf}
    prompt-design-pdf: ${MATH_AGENT_PROMPT_DESIGN_PDF:C:/Users/doob/Desktop/code/dev/math_agent_rag/文档/豆包爱学的提示词设计.pdf}
    local-file-storage-root: ${MATH_AGENT_LOCAL_FILE_STORAGE_ROOT:C:/Users/doob/Desktop/code/dev/math_agent_rag/.local-storage}
