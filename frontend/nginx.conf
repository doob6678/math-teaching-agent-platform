resolver 127.0.0.11 valid=10s ipv6=off;

# Console origin: http://mathagent.local (hosts-mapped to 127.0.0.1:80).
server {
    listen 80;
    server_name mathagent.local _;
    charset utf-8;
    client_max_body_size 256m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "UP\n";
    }

    # Browser authentication, SSE, MCP and resource assets stay same-origin through this reverse proxy.
    location /api/ {
        set $backend_upstream backend:8080;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The browser talks to this reverse proxy on one origin. Do not forward that browser Origin to the internal
        # backend service, otherwise a changing WSL NAT address is misclassified as a cross-origin API request.
        proxy_set_header Origin "";
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Vite 产物文件名带内容 hash，可以永久缓存；index.html 必须每次回源校验，
    # 否则容器重建后浏览器仍用启发式缓存渲染旧 bundle（2026-08-30 截图验收踩坑）。
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}

# Backend API origin: http://api.mathagent.local (same hosts mapping). External MCP
# clients use this instead of http://127.0.0.1:8080; paths pass through unchanged
# because the backend owns the /api prefix (same routing as the console /api/ proxy).
server {
    listen 80;
    server_name api.mathagent.local;
    charset utf-8;
    client_max_body_size 256m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        proxy_pass http://backend:8080;
    }

    location / {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Keep the same Origin-stripping contract as the console /api/ proxy so the
        # WSL NAT address is never misclassified as a cross-origin request.
        proxy_set_header Origin "";
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
