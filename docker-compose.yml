name: math-agent-rag

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: ${MATH_AGENT_DB_NAME:-math_agent_rag}
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports: ["${MATH_AGENT_MYSQL_HOST_PORT:-3307}:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend-java/src/main/resources/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports: ["${MATH_AGENT_REDIS_HOST_PORT:-6380}:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    ports:
      - "${MATH_AGENT_RABBITMQ_HOST_PORT:-5673}:5672"
      - "${MATH_AGENT_RABBITMQ_MANAGEMENT_HOST_PORT:-15673}:15672"
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.18
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    volumes: ["milvus-etcd-data:/etcd"]
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 20

  milvus-minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: ${MATH_AGENT_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MATH_AGENT_MINIO_SECRET_KEY:?set in .env}
    command: minio server /minio_data --console-address ":9001"
    volumes: ["milvus-minio-data:/minio_data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20

  milvus:
    image: milvusdb/milvus:v2.6.11
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt: ["seccomp:unconfined"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_ACCESS_KEY_ID: ${MATH_AGENT_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MATH_AGENT_MINIO_SECRET_KEY:?set in .env}
      COMMON_SECURITY_AUTHORIZATIONENABLED: "true"
      COMMON_SECURITY_DEFAULTROOTPASSWORD: ${MATH_AGENT_MILVUS_ROOT_PASSWORD:?set in .env}
    ports:
      - "${MATH_AGENT_MILVUS_HOST_PORT:-19531}:19530"
      - "${MATH_AGENT_MILVUS_METRICS_HOST_PORT:-9092}:9091"
    volumes: ["milvus-data:/var/lib/milvus"]
    depends_on:
      milvus-etcd: {condition: service_healthy}
      milvus-minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9091/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 20

  ai-worker:
    build: ./ai-worker-python
    restart: unless-stopped
    environment:
      MATH_AGENT_WORKER_API_KEY: ${MATH_AGENT_WORKER_API_KEY:?set in .env}
      MATH_AGENT_TOOL_BROKER_BASE_URL: http://backend:8080
      MATH_AGENT_AGENT_WORKER_SHARED_KEY: ${MATH_AGENT_AGENT_WORKER_SHARED_KEY:?set in .env}
      MATH_AGENT_DB_HOST: mysql
      MATH_AGENT_DB_PORT: 3306
      MATH_AGENT_DB_USERNAME: root
      MATH_AGENT_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MATH_AGENT_DB_NAME: ${MATH_AGENT_DB_NAME:-math_agent_rag}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      # 禁止恢复 DashScope embedding；教材向量、重排和图像向量必须始终留在只读挂载的本地模型中。
      # Do not restore DashScope embeddings; text vectors, reranking, and CLIP must remain on local read-only models.
      MATH_AGENT_EMBEDDING_PROVIDER_ORDER: local_bge_embedding
      MATH_AGENT_RERANK_PROVIDER_ORDER: local_bge_reranker
      MATH_AGENT_CLIP_PROVIDER_ORDER: local_clip
      MATH_AGENT_EMBEDDING_DIMENSION: ${MATH_AGENT_EMBEDDING_DIMENSION:-512}
      MATH_AGENT_LOCAL_CLIP_MODEL_PATH: ${MATH_AGENT_CONTAINER_CLIP_MODEL_PATH:?set in .env}
      MATH_AGENT_LOCAL_RERANK_MODEL_PATH: ${MATH_AGENT_CONTAINER_RERANK_MODEL_PATH:?set in .env}
      MATH_AGENT_LOCAL_TEXT_EMBEDDING_MODEL_PATH: ${MATH_AGENT_CONTAINER_TEXT_MODEL_PATH:?set in .env}
      MATH_AGENT_LOCAL_CLIP_DEVICE: cuda
      MATH_AGENT_LOCAL_RERANK_DEVICE: cuda
      MATH_AGENT_LOCAL_TEXT_EMBEDDING_DEVICE: cuda
      MATH_AGENT_USAGE_LEDGER_PATH: /app/data/usage/provider-usage.jsonl
    gpus: all
    ports: ["${MATH_AGENT_WORKER_HOST_PORT:-8092}:8091"]
    volumes:
      - worker-data:/app/data
      - ${MATH_AGENT_MODEL_ROOT:?set in .env}:/models:ro
    depends_on:
      mysql: {condition: service_healthy}

  backend:
    build:
      context: .
      dockerfile: backend-java/Dockerfile
    restart: unless-stopped
    # Docker Desktop's inherited WSL resolver cannot resolve the configured OpenAI relay CNAME chain. Google DNS
    # resolves it from the same host network and keeps provider calls inside the container deterministic.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      MATH_AGENT_DB_URL: jdbc:mysql://mysql:3306/${MATH_AGENT_DB_NAME:-math_agent_rag}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
      MATH_AGENT_DB_USERNAME: root
      MATH_AGENT_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      # Redisson and Spring Data Redis are separate clients; both must target the Compose service rather than localhost.
      MATH_AGENT_REDIS_REDISSON_ADDRESS: redis://redis:6379
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      MATH_AGENT_RABBITMQ_LISTENER_AUTO_STARTUP: "true"
      MATH_AGENT_AGENT_WORKER_SHARED_KEY: ${MATH_AGENT_AGENT_WORKER_SHARED_KEY:?set in .env}
      MATH_AGENT_AGENT_WORKER_CAPABILITY_SECRET: ${MATH_AGENT_AGENT_WORKER_CAPABILITY_SECRET:?set in .env}
      # Distributed writing dispatch publishes durable RabbitMQ tasks. This service also hosts the Java worker
      # runtime, so queued workflows always have a live lease-owning consumer in the standard Compose deployment.
      MATH_AGENT_AGENT_WORKER_DISPATCH_ENABLED: "true"
      MATH_AGENT_AGENT_WORKER_RUNTIME_ENABLED: "true"
      MATH_AGENT_AGENT_WORKER_ID: ${MATH_AGENT_AGENT_WORKER_ID:-compose-agent-worker}
      MATH_AGENT_AGENT_WORKER_MAX_CONCURRENCY: ${MATH_AGENT_AGENT_WORKER_MAX_CONCURRENCY:-1}
      MATH_AGENT_EMBEDDING_BASE_URL: http://ai-worker:8091/v1
      MATH_AGENT_EMBEDDING_API_KEY: ${MATH_AGENT_WORKER_API_KEY:?set in .env}
      MATH_AGENT_EMBEDDING_MODEL: local_bge_embedding
      MATH_AGENT_EMBEDDING_BATCH_SIZE: ${MATH_AGENT_EMBEDDING_BATCH_SIZE:-10}
      MATH_AGENT_TEACHER_IMAGE_CLIP_ENABLED: "true"
      MATH_AGENT_PROCESSED_BOOKS_ROOT: /app/data/textbooks
      MATH_AGENT_VECTOR_INDEX_MILVUS_URI: http://milvus:19530
      MATH_AGENT_MILVUS_TOKEN: root:${MATH_AGENT_MILVUS_ROOT_PASSWORD:?set in .env}
      MATH_AGENT_TEACHER_SYNC_FEISHU_DOWNLOADER_SCRIPT: /app/scripts/download_feishu_url.py
      MATH_AGENT_PYTHON_EXECUTABLE: python3
      # PDFBox fallback must embed a real CJK TTF; Helvetica silently turns every Chinese glyph into '?'.
      MATH_AGENT_PDF_FONT_PATH: /app/fonts/cjk.ttf
      MATH_AGENT_TEACHER_SYNC_FEISHU_STAGING_ROOT: /app/data/teacher-source-imports
      MATH_AGENT_TEACHER_SYNC_ASSET_STORAGE_ROOT: /app/data/teacher-assets
      FEISHU_APP_ID: ${FEISHU_APP_ID:-${FEISHU_APPID:-}}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-${FEISHU_APPSECRET:-}}
      # The bundled Python downloader uses APP_ID/APP_SECRET; keep the aliases sourced from the same operator values
      # so OAuth and tenant-bot synchronization cannot disagree about whether Feishu is configured.
      APP_ID: ${FEISHU_APP_ID:-${FEISHU_APPID:-}}
      APP_SECRET: ${FEISHU_APP_SECRET:-${FEISHU_APPSECRET:-}}
      FEISHU_OAUTH_REDIRECT_URI: ${FEISHU_OAUTH_REDIRECT_URI:-}
      FEISHU_OAUTH_SUCCESS_REDIRECT_URI: ${FEISHU_OAUTH_SUCCESS_REDIRECT_URI:-}
      FEISHU_OAUTH_SCOPES: "${FEISHU_OAUTH_SCOPES:-drive:drive:readonly drive:drive.metadata:readonly docx:document:readonly}"
      FEISHU_TOKEN_ENCRYPTION_KEY: ${FEISHU_TOKEN_ENCRYPTION_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-5.6-luna}
      MATH_AGENT_AI_CHAT_REQUEST_TIMEOUT_MS: ${MATH_AGENT_AI_CHAT_REQUEST_TIMEOUT_MS:-120000}
      MATH_AGENT_AI_CHAT_MAX_OUTPUT_TOKENS: ${MATH_AGENT_AI_CHAT_MAX_OUTPUT_TOKENS:-800}
      MATH_AGENT_AI_CHAT_STREAM_MAX_ATTEMPTS: ${MATH_AGENT_AI_CHAT_STREAM_MAX_ATTEMPTS:-3}
      MATH_AGENT_AI_CHAT_RETRY_BASE_DELAY_MS: ${MATH_AGENT_AI_CHAT_RETRY_BASE_DELAY_MS:-400}
    ports: ["${MATH_AGENT_BACKEND_HOST_PORT:-8081}:8080"]
    volumes:
      - backend-data:/app/data
      - ${MATH_AGENT_PROCESSED_BOOKS_HOST_ROOT:?set in .env}:/app/data/textbooks:ro
      - ${MATH_AGENT_PDF_FONT_HOST_PATH:?set in .env}:/app/fonts/cjk.ttf:ro
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      milvus: {condition: service_healthy}
      ai-worker: {condition: service_healthy}

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports: ["${MATH_AGENT_FRONTEND_HOST_PORT:-5174}:80"]
    depends_on:
      backend: {condition: service_healthy}

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  milvus-etcd-data:
  milvus-minio-data:
  milvus-data:
  worker-data:
  backend-data:
