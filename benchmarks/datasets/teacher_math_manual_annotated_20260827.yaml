    source_excerpt: "#### 转化规则（全覆盖无遗漏） 若两条直线l_1,l_2的斜率k_1,k_2均存在，则： \\boldsymbol{l_1\\perp l_2 \\iff k_1·k_2 = -1} 斜率不存在的特殊垂直：一条直线斜率为0（平行x轴，\\alpha=0），另一条直线斜率不存在（垂直x轴，\\alpha=\\frac{\\pi}{2}），两直线也垂直。 #### 适用场景 直角三角形、直径所对圆周角、菱形对角线垂直、矩形邻边垂直等所有90°角场景。 #### 简单例题 已知A(0,0)，B(4,0)，点P在直线y=x-1上，且\\angle APB=90^\\circ，求P的坐标。 解：设P(x,x-1) ① 斜率均存在时：k_{PA}=\\frac{x-1}{x}，k_{PB}=\\frac{x-1}{x-4}，由垂直得k_{PA}·k_{PB}=-1 代入化简得2x^2-6x+1=0，解得x=\\frac{3\\pm\\sqrt{7}}{2} ② 验证斜率不存在的情况：x=0或x=4时，P分别为(0,-1)、(4,3)，均不满足直角条件，舍去。 最终P点坐标为\\left(\\frac{3+\\sqrt{7}}{2},\\frac{1+\\sqrt{7}}{2}\\right)、\\left(\\frac{3-\\sqrt{7}}{2},\\frac{1-\\sqrt{7}}{2}\\right)。 ---"
