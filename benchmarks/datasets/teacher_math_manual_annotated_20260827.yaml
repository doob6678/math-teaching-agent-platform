    block_order: 3
    source_excerpt: "离心率 e 的核心作用是量化椭圆的扁平程度，我们可以通过公式推导直观理解： 由 a^2 = b^2 + c^2，两边同除以 a^2 得： 1 = \\left(\\frac{b}{a}\\right)^2 + e^2 \\implies \\frac{b}{a} = \\sqrt{1-e^2} \\frac{b}{a} 是短半轴与长半轴的比值：这个比值越接近1，椭圆越接近正圆形；比值越小，椭圆越扁。 结合 e \\in (0,1)，可以得到结论： e 越接近1：\\sqrt{1-e^2} 越小，\\frac{b}{a} 越小，短轴相对长轴越短，椭圆越扁；此时焦点离椭圆中心越远，椭圆被“拉得越长”。 e 越接近0：\\sqrt{1-e^2} 越接近1，\\frac{b}{a} 越接近1，短轴与长轴长度越接近，椭圆越圆；此时焦点离椭圆中心越近，椭圆形态越饱满。 举两个直观例子： 若 e=0.1，\\frac{b}{a}\\approx0.995，椭圆几乎和圆看不出区别； 若 e=0.9，\\frac{b}{a}\\approx0.436，椭圆会非常扁长。 ---"
