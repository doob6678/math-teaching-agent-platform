    source_excerpt: "有放回的意思是：每次摸完后，球放回盒中，下一次盒中球的组成不变。 若盒中共有 N 个球，其中红球 M 个，每次摸 1 个，摸后放回，重复摸 m 次，设摸到红球的个数为 X，则每次摸到红球的概率恒为 p=\\frac MN，并且各次相互独立。 所以 X\\sim B(m,p)，即 P(X=k)=C_m^k p^k(1-p)^{m-k}。 例如每次摸 1 个，摸后放回，问 m 次中恰好摸到 k 次红球，就是二项分布。"
