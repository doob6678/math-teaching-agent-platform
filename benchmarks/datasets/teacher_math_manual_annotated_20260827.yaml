    source_excerpt: "解析几何里，很多轨迹问题并不是直接求动点，而是先给出一个已知点，再由这个点构造出另一个点。 例如已知点P₀(x₀,y₀)在曲线C上，即 F(x₀,y₀)=0 然后从P₀出发，作直线、切线、垂线、中点、交点，得到新的动点P(x,y)。题目最终要求的往往是P(x,y)的轨迹。 这类题的关键不是一直保留x₀、y₀，而是要意识到： x₀、y₀只是构造过程中的中间变量，真正要求的是x、y。 所以应当想办法用x、y表示x₀、y₀，再代回原曲线方程 F(x₀,y₀)=0 从而得到只含x、y的轨迹方程。 也就是说，轨迹问题常用的消参方向逻辑： P₀(x₀,y₀)属于曲线C ⇒ 生成动点P(x,y) 但求轨迹时要反过来处理： x₀=φ(x,y)，y₀=ψ(x,y) 再代入 F(x₀,y₀)=0 得到 F(φ(x,y),ψ(x,y))=0 这就是动点P(x,y)的轨迹。 举例说明：若P(x,y)是由P₀(x₀,y₀)经过某种几何关系得到的点，题目中可能先推出 x=2x₀+1，y=y₀−3 不要停留在用x₀、y₀表示x、y这一步，我们最终需要x与y的关系式。应当反解出 x₀=(x−1)/2，y₀=y+3 再将其代入P₀所在的曲线方程。 所以解析几何中的轨迹消参，本质是： 已知源点满足原曲线方程，轨迹点才是最终变量；只要能用x、y表示出x₀、y₀，就优先消去中间量x₀、y₀。 总结一句话： 源点满足曲线方"
