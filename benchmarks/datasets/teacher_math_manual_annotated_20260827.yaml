    source_excerpt: "已知数列前 n 项和 S_n = 2n^2 - 5n + 3，求通项公式 a_n。 --- 注意 求通项公式，使用 a_n = S_n - S_{n-1} 时候一定要注意 n \\ge 2 所以一定要先求出来 a_1 最后把 a_1 代入求出来的通项公式验证是否满足 如果符合就直接合并到通项公式，否则写成分段 #### 详细求解步骤 求首项 a_1 当 n=1 时，a_1 = S_1，代入得： a_1 = 2\\times1^2 - 5\\times1 + 3 = 2 - 5 + 3 = 0 求 n \\ge 2 时的通项 当 n \\ge 2 时，通项公式为 a_n = S_n - S_{n-1}。 先计算 S_{n-1}： S_{n-1} = 2(n-1)^2 - 5(n-1) + 3 = 2(n^2 - 2n + 1) - 5n + 5 + 3 = 2n^2 - 4n + 2 - 5n + 8 = 2n^2 - 9n + 10 再计算 a_n： a_n = S_n - S_{n-1} = (2n^2 - 5n + 3) - (2n^2 - 9n + 10) = 2n^2 - 5n + 3 - 2n^2 + 9n - 10 = 4n - 7 判断并区分 a_1 将 n=1 代入 n \\ge 2 时的表达式 4n - 7： 4\\times1 - 7 = -3 \\neq a_1 = 0 因此"
